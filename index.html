<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Controle de finanças compartilhadas do casal" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HouseFinance" />
    <link rel="apple-touch-icon" href="/housefinance/icon.svg" />
    <link rel="manifest" href="/housefinance/manifest.json" />

    <title>House Finance</title>

    <!-- Aplica o tema salvo antes do React montar (evita flash claro e cobre Login/Perfil) -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t && t !== 'light') document.documentElement.classList.add('dark');
        if (t === 'brasil' || t === 'natal' || t === 'amor') document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
